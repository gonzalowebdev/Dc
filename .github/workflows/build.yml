name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Compilar (debug + release)
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Anotar errores de compilación
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|FAILED|Execution failed|Could not" -A3 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::${msg}"

      - name: Preparar APKs
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MediaDownloaderHub-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/MediaDownloaderHub-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderHub-apk
          path: dist/*.apk

      - name: Publicar release con los APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --title "Media Downloader Hub build ${{ github.run_number }}" \
            --notes "APK de depuración y release generados automáticamente (commit ${{ github.sha }})."
